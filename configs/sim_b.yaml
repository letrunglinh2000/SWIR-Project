# sim_B -- HELD-OUT evaluation simulator (spec §7.7).
# Disjoint from sim_A in kernel family, noise mode and transmission model.
# Results under sim_B are SIMULATOR-SHIFT / synthetic-OOD robustness.
# They are NOT external validity (spec §17.14).
degradation:
  name: sim_B
  probabilities:
    blur_p: 0.70
    noise_p: 0.60
    low_light_p: 0.45
    backscatter_p: 0.35
  illumination:
    alpha_range: [0.10, 0.70]
    gamma_range: [1.2, 2.6]
  backscatter:
    model: atmospheric_veiling
    t_field: smooth              # sim_A uses `horizon`
    beta_range: [0.6, 2.4]
    A_base_range: [0.4, 0.95]
    exposure_coupling_kappa: [0.0, 1.0]
  optics:
    kernel_families: [motion, aniso]   # sim_A uses [iso, aniso]
    kernel_weights: [0.6, 0.4]
    kernel_size: 21
    sigma_range: [0.4, 2.6]
    motion_length_range: [3.0, 11.0]
    downsample_interp: [nearest, bilinear]   # sim_A uses [area, bilinear, bicubic]
  noise:
    version: v1                  # sim_A uses v2
    gain_range: [40.0, 900.0]
    read_sigma_range: [0.004, 0.03]
  quantization:
    mode: source
    bits: null
